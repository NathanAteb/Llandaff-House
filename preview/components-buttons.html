<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">

  body{padding:32px;background:var(--bg);display:flex;flex-direction:column;gap:24px;align-items:flex-start;}

<div class="group">
  <div class="label">Secondary</div>

  <a class="btn btn--secondary">Read the CIW report</a>
</div>
<div class="group">
  <div class="label">Ghost</div>
  <a class="btn btn--ghost">Learn more <i data-lucide="arrow-right" class="icon"></i></a>
</div>
