<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../kit.css">
<style>
  body{margin:0;padding:40px;background:var(--bg);display:flex;flex-direction:column;gap:28px;align-items:flex-start;}
  .row{display:flex;align-items:center;gap:32px;}
  .row.dark{padding:24px 32px;background:var(--ink-900);border-radius:var(--radius-md);}
  .row.cream{padding:24px 32px;background:var(--cream-100);border-radius:var(--radius-md);}
  .wordmark__plate.lg{font-size:24px;padding:12px 18px 12px 16px;}
  .wordmark__plate.lg small{font-size:11px;}
  .note{font-family:var(--font-sans);font-size:12px;color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;}
</style></head><body>
<div class="row">
  <span class="wordmark__plate lg">
    <span class="wordmark__plate-name">
      <small>Cathedral Care</small>
      Llandaff House
    </span>
  </span>
  <span class="note">primary — on cream</span>
</div>
<div class="row cream">
  <span class="wordmark__plate">
    <span class="wordmark__plate-name">
      <small>Cathedral Care</small>
      Llandaff House
    </span>
  </span>
  <span class="note" style="color:var(--ink-700);">small — header</span>
</div>
<div class="row dark">
  <span class="wordmark__plate">
    <span class="wordmark__plate-name">
      <small>Cathedral Care</small>
      Llandaff House
    </span>
  </span>
  <span class="note" style="color:var(--cream-100);opacity:.7;">on dark — footer</span>
</div>
</body></html>
