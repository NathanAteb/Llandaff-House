<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:36px 24px;background:var(--cream-100);}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
  .box{background:var(--bone);border:1px solid var(--ink-100);border-radius:var(--radius-md);height:90px;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--fg-1);}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-3);letter-spacing:.06em;text-transform:uppercase;margin-top:10px;text-align:center;}
</style></head><body>
<div class="row">
  <div><div class="box" style="box-shadow:var(--shadow-xs);">xs</div><div class="name">--shadow-xs</div></div>
  <div><div class="box" style="box-shadow:var(--shadow-sm);">sm</div><div class="name">--shadow-sm · card default</div></div>
  <div><div class="box" style="box-shadow:var(--shadow-md);">md</div><div class="name">--shadow-md · hover</div></div>
  <div><div class="box" style="box-shadow:var(--shadow-lg);">lg</div><div class="name">--shadow-lg · modal</div></div>
</div>
</body></html>
