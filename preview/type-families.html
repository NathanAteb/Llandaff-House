<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:32px;background:var(--bg);}
  blockquote{margin:0 0 24px;}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  .spec{font-family:var(--font-sans);font-size:11px;color:var(--fg-3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;}
  .family{font-family:var(--font-serif);font-size:48px;color:var(--ink-900);line-height:1;}
  .family.sans{font-family:var(--font-sans);font-weight:500;}
  .name{font-family:var(--font-sans);font-size:13px;color:var(--fg-3);margin-top:8px;}
</style></head><body>
<div class="pair">
  <div>
    <div class="spec">Display — serif</div>
    <div class="family">Aa Bb Cc 123</div>
    <div class="name">Lora · 400/500/600</div>
  </div>
  <div>
    <div class="spec">UI &amp; body — sans</div>
    <div class="family sans">Aa Bb Cc 123</div>
    <div class="name">Inter · 400/500/600/700</div>
  </div>
</div>
</body></html>
