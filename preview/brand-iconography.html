<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;padding:28px;background:var(--bg);}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:18px;}
  .it{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--teal-700);}
  .it svg{width:30px;height:30px;stroke-width:1.5;}
  .it span{font-family:var(--font-sans);font-size:11px;color:var(--fg-3);}
  .meta{font-family:var(--font-sans);font-size:12px;color:var(--fg-3);margin-bottom:14px;letter-spacing:.06em;text-transform:uppercase;}
</style></head><body>
<p class="meta">Lucide · 1.5px stroke · inherits currentColor</p>
<div class="grid">
  <div class="it"><i data-lucide="phone"></i><span>phone</span></div>
  <div class="it"><i data-lucide="map-pin"></i><span>map-pin</span></div>
  <div class="it"><i data-lucide="mail"></i><span>mail</span></div>
  <div class="it"><i data-lucide="heart-handshake"></i><span>care</span></div>
  <div class="it"><i data-lucide="home"></i><span>home</span></div>
  <div class="it"><i data-lucide="flower-2"></i><span>garden</span></div>
  <div class="it"><i data-lucide="shield-check"></i><span>CIW</span></div>
  <div class="it"><i data-lucide="file-text"></i><span>document</span></div>
  <div class="it"><i data-lucide="calendar-heart"></i><span>activity</span></div>
  <div class="it"><i data-lucide="utensils"></i><span>meals</span></div>
  <div class="it"><i data-lucide="brain"></i><span>dementia</span></div>
  <div class="it"><i data-lucide="brush"></i><span>spa day</span></div>
  <div class="it"><i data-lucide="church"></i><span>services</span></div>
  <div class="it"><i data-lucide="clock"></i><span>visiting</span></div>
  <div class="it"><i data-lucide="arrow-right"></i><span>cta</span></div>
  <div class="it"><i data-lucide="check"></i><span>check</span></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
