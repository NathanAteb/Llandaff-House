<!-- @dsCard group="Spacing" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--bg);}
  table{width:100%;border-collapse:collapse;font-family:var(--font-sans);font-size:14px;}
  td{padding:6px 8px;border-bottom:1px solid var(--ink-100);vertical-align:middle;}
  td:first-child{font-weight:600;color:var(--fg-1);width:88px;font-feature-settings:"tnum";}
  td:nth-child(2){color:var(--fg-3);width:60px;font-feature-settings:"tnum";}
  .bar{height:14px;background:var(--teal-300);border-radius:4px;}
</style></head><body>
<table>
  <tr><td>--space-1</td><td>4px</td><td><div class="bar" style="width:4px;"></div></td></tr>
  <tr><td>--space-2</td><td>8px</td><td><div class="bar" style="width:8px;"></div></td></tr>
  <tr><td>--space-3</td><td>12px</td><td><div class="bar" style="width:12px;"></div></td></tr>
  <tr><td>--space-4</td><td>16px</td><td><div class="bar" style="width:16px;"></div></td></tr>
  <tr><td>--space-5</td><td>24px</td><td><div class="bar" style="width:24px;"></div></td></tr>
  <tr><td>--space-6</td><td>32px</td><td><div class="bar" style="width:32px;"></div></td></tr>
  <tr><td>--space-7</td><td>48px</td><td><div class="bar" style="width:48px;"></div></td></tr>
  <tr><td>--space-8</td><td>64px</td><td><div class="bar" style="width:64px;"></div></td></tr>
  <tr><td>--space-9</td><td>96px</td><td><div class="bar" style="width:96px;"></div></td></tr>
  <tr><td>--space-10</td><td>128px</td><td><div class="bar" style="width:128px;"></div></td></tr>
</table>
</body></html>
