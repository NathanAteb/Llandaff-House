<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:32px;background:var(--bg);}
  .row{display:grid;grid-template-columns:80px 1fr;gap:24px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--ink-100);}
  .row:last-child{border-bottom:0;}
  .label{font-family:var(--font-sans);font-size:11px;color:var(--fg-3);letter-spacing:.1em;text-transform:uppercase;}
  .spec{font-family:var(--font-sans);font-size:11px;color:var(--fg-3);}
  h1,h2,h3,h4{margin:0;}
</style></head><body>
<div class="row"><div class="label">H1 · 54px</div><h1>A safe home in Llangennech</h1></div>
<div class="row"><div class="label">H2 · 42px</div><h2>Life with us</h2></div>
<div class="row"><div class="label">H3 · 27px</div><h3>Our weekly Tuesday spa day</h3></div>
<div class="row"><div class="label">H4 · 22px</div><h4>Residential and dementia care</h4></div>
<div class="row"><div class="label">Lede · 22pt italic</div><p class="lede" style="margin:0;">Llandaff House is situated in Llangennech, a small village in the Llanelli area.</p></div>
</body></html>
