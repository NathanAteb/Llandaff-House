<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--bg);}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .item{display:flex;flex-direction:column;gap:8px;}
  .chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--ink-100);}
  .name{font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--fg-1);}
  .desc{font-family:var(--font-sans);font-size:12px;color:var(--fg-3);}
</style></head><body>
<div class="row">
  <div class="item"><div class="chip" style="background:var(--success);"></div><div class="name">Success</div><div class="desc">#6FB29F</div></div>
  <div class="item"><div class="chip" style="background:var(--warning);"></div><div class="name">Warning</div><div class="desc">#E0B872</div></div>
  <div class="item"><div class="chip" style="background:var(--danger);"></div><div class="name">Danger</div><div class="desc">#D38078</div></div>
  <div class="item"><div class="chip" style="background:var(--info);"></div><div class="name">Info</div><div class="desc">#8AA8C0</div></div>
</div>
</body></html>
