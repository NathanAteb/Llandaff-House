<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../kit.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{padding:28px;background:var(--cream-100);display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
</style></head><body>
<div class="card card--feature">
  <span class="card__icon"><i data-lucide="heart-handshake"></i></span>
  <h4 class="card__title">Residential care</h4>
  <p class="card__body">Independent living, supported with kindness. We adapt around each resident.</p>
</div>
<div class="card card--feature">
  <span class="card__icon"><i data-lucide="brain"></i></span>
  <h4 class="card__title">Dementia care</h4>
  <p class="card__body">We support residents with dementia of varying stages, alongside visiting professionals.</p>
</div>
<div class="card card--feature">
  <span class="card__icon"><i data-lucide="hand-helping"></i></span>
  <h4 class="card__title">Equipment &amp; support</h4>
  <p class="card__body">Hoists, slide sheets and Sara Steady — quietly available when they're needed.</p>
</div>
<script>lucide.createIcons();</script>
